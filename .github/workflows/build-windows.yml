# 윈도우용 실행 폴더(zip)를 빌드해 Releases에 올린다.
#
# 단일 exe(--onefile)를 쓰지 않는 이유(2026-11-14): onefile은 바깥 런처가 따로 떠서,
# PC를 끄거나 로그오프할 때 런처가 '꺼진다'는 신호를 먼저 받고 키퍼를 강제로 끝낸다.
# 그래서 키퍼가 정상 종료를 기록하지 못하고(오탐), 종료 순서를 맨 뒤로 미룬 설정도 소용없었다.
# 폴더(--onedir) 빌드는 프로세스가 하나라 이 문제가 없다.
# 리눅스에선 윈도우 exe를 못 만들기 때문에, 빌드는 GitHub의 windows 러너에 맡긴다.
#
# 쓰는 법
#  - 그냥 빌드만 받아보기: Actions 탭 → 이 워크플로 → "Run workflow"(수동 실행).
#    끝나면 Artifacts에서 zip을 내려받는다.
#  - 정식 배포: 버전 태그를 올리면(예: git tag v0.1.0 && git push origin v0.1.0)
#    자동으로 빌드해 그 태그의 Release에 zip을 첨부한다.
#
# 참고: 서명하지 않은 exe라 처음 실행 시 SmartScreen 경고가 뜰 수 있다(추가 정보 → 실행).
# 코드 서명 인증서는 유료라 가정용에는 넣지 않는다. 이 트레이드오프는 SPEC 1절에 적어 둠.

name: build-windows

on:
  workflow_dispatch:        # 수동 실행 (Actions 탭에서 버전 입력 후 Run)
    inputs:
      version:
        description: "릴리스 버전 (예: v0.1.0). 이 이름으로 태그와 릴리스를 만든다."
        default: "v0.1.0"
        required: true
  push:
    tags:
      - "v*"                 # 버전 태그를 올리면 자동 빌드+릴리스

permissions:
  contents: write            # 릴리스에 zip을 첨부하려면 필요

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: python -m pip install --upgrade pip customtkinter pyinstaller

      - name: exe 빌드
        # onedir(기본값): 실행 파일 + _internal 폴더 / windowed: 콘솔 창 없음(pythonw처럼)
        # collect-all: customtkinter의 테마·에셋 파일과 darkdetect를 함께 담는다
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name time-keeper-windows
          --collect-all customtkinter
          --collect-all darkdetect
          time_keeper.pyw

      - name: zip으로 묶기
        shell: pwsh
        run: Compress-Archive -Path dist/time-keeper-windows -DestinationPath dist/time-keeper-windows.zip

      - name: 빌드 결과 업로드 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: time-keeper-windows-zip
          path: dist/time-keeper-windows.zip
          if-no-files-found: error

      - name: 릴리스에 첨부 (태그 푸시 또는 수동 실행)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 태그 푸시면 그 태그를, 수동 실행이면 입력한 버전을 쓴다.
          # gh release create는 태그가 없으면 GitHub 서버에서 만들어 준다(로컬 태그 푸시 불필요).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          NOTES="zip을 받아 압축을 풀고, 폴더 안의 time-keeper-windows.exe를 실행하세요. 설치나 파이썬이 필요 없습니다.
          (폴더째 지우지 않을 위치에 두세요. exe만 따로 꺼내면 실행되지 않습니다.)

          처음 실행 시 'Windows의 PC 보호' 경고가 뜨면 '추가 정보 → 실행'을 눌러 주세요.
          (서명하지 않은 exe라 생기는 안내이며, 앱이 하는 일은 SPEC.md에 전부 공개되어 있습니다.)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/time-keeper-windows.zip --clobber
          else
            gh release create "$TAG" dist/time-keeper-windows.zip \
              --target "$GITHUB_SHA" --title "time-keeper-windows $TAG" --notes "$NOTES"
          fi
